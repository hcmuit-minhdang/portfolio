<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <style>
    :root {
      --p-dark: #3d2856;
      --p-deep: #583d78;
      --p-mid: #7d5ca3;
      --p-soft: #a283c9;
      --p-light: #c8b3e3;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --p-dark: #6f42a8;
        --p-deep: #9663d6;
        --p-mid: #b688ee;
        --p-soft: #d2b3f7;
        --p-light: #eadcfc;
      }
    }
  </style>
  <defs>
    <linearGradient id="leftPillarOuter" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--p-dark)" />
      <stop offset="100%" stop-color="var(--p-deep)" />
    </linearGradient>
    <linearGradient id="leftPillarInner" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--p-mid)" />
      <stop offset="100%" stop-color="var(--p-light)" />
    </linearGradient>
    <linearGradient id="leftArch" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="var(--p-dark)" />
      <stop offset="55%" stop-color="var(--p-deep)" />
      <stop offset="100%" stop-color="var(--p-mid)" />
    </linearGradient>
    <linearGradient id="rightArchTop" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="var(--p-mid)" />
      <stop offset="55%" stop-color="var(--p-soft)" />
      <stop offset="100%" stop-color="var(--p-light)" />
    </linearGradient>
    <linearGradient id="rightArchShadow" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="var(--p-deep)" />
      <stop offset="100%" stop-color="var(--p-mid)" />
    </linearGradient>
    <linearGradient id="rightPillarInner" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--p-deep)" />
      <stop offset="100%" stop-color="var(--p-mid)" />
    </linearGradient>
    <linearGradient id="rightPillarOuter" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--p-soft)" />
      <stop offset="100%" stop-color="var(--p-light)" />
    </linearGradient>
  </defs>

  <!-- Cột trái (2 mặt vát tạo khối 3D) -->
  <path
    d="M7 18.5C11.5 19.5 14 22.5 16 26.5V48C16 52.5 12.5 56 7 56V18.5Z"
    fill="url(#leftPillarOuter)"
  />
  <path
    d="M16 26.5L21.5 34.5V46.5C21.5 52.8 16.5 56 7 56C12.5 56 16 52.5 16 48V26.5Z"
    fill="url(#leftPillarInner)"
  />

  <!-- Dải lụa trái đổ xuống giữa -->
  <path
    d="M7 8H13.5C19.5 8 23.2 11.5 26.8 18.5L34.5 33.2L26.5 39.5L19.5 26C16.2 19.5 13 16 7 15.8V8Z"
    fill="url(#leftArch)"
  />

  <!-- Cột phải (2 mặt vát tạo khối 3D) -->
  <path
    d="M57 18.5C52.5 19.5 50 22.5 48 26.5V48C48 52.5 51.5 56 57 56V18.5Z"
    fill="url(#rightPillarOuter)"
  />
  <path
    d="M48 26.5L42.5 34.5V46.5C42.5 52.8 47.5 56 57 56C51.5 56 48 52.5 48 48V26.5Z"
    fill="url(#rightPillarInner)"
  />

  <!-- Dải lụa phải vòng từ tâm lên góc phải (chồng lên dải trái) -->
  <path
    d="M25 38.2C27.5 42.2 31.2 44.5 34.8 44.5C38.8 44.5 41.8 41.2 44.8 35.5L49.5 26.5C52.2 21.2 54.4 16.4 57 15.8V8H50.5C44.5 8 40.8 11.5 37.2 18.5L29.5 33.2C28 36 26.5 37.6 25 38.2Z"
    fill="url(#rightArchTop)"
  />
  <!-- Viền bóng dưới dải lụa phải để tạo chiều sâu gấp nếp -->
  <path
    d="M25 38.2C27.6 42.4 31.4 44.5 35 44.5C38.8 44.5 41.8 41.2 44.8 35.5L49.2 27.1C46.5 31.8 43 37.2 38.5 39.2C34 41.2 29.5 40.4 25 38.2Z"
    fill="url(#rightArchShadow)"
    opacity="0.82"
  />
</svg>
